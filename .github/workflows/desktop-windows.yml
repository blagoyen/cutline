name: Build Cutline Desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Cutline Windows NSIS installer
        run: npm run app:build

      - name: Verify installer & generate SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found!" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"
          Write-Host "Built $($exe.Name) ($($exe.Length) bytes) SHA-256: $hash"
          "INSTALLER_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_SHA=$($exe.FullName).sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-windows-installer
          path: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.INSTALLER_SHA }}

      - name: Attach Windows installer to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          gh release upload $tag $env:INSTALLER_PATH $env:INSTALLER_SHA --clobber
