name: Build Cutline iOS (.ipa)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust & iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install XcodeGen & CocoaPods
        run: |
          brew install xcodegen || true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Initialize Tauri iOS project
        run: npx tauri ios init --ci

      - name: Inject Cutline AVFoundation Swift bridge & iOS permissions
        run: |
          set -euo pipefail
          IOS_SRC="src-tauri/gen/apple/Sources/cutline"
          mkdir -p "$IOS_SRC"
          cp "src-tauri/ios-plugin/CutlineMedia.swift" "$IOS_SRC/CutlineMedia.swift"

          PLIST="src-tauri/gen/apple/cutline_iOS/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Cutline saves exported video clips directly to your Photos library.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Cutline saves exported video clips directly to your Photos library.'" "$PLIST"

            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"

            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          fi

          # Regenerate Xcode project so CutlineMedia.swift is compiled into the app target
          (cd src-tauri/gen/apple && xcodegen generate)

      - name: Compile Rust staticlib for aarch64-apple-ios
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --target aarch64-apple-ios --lib

      - name: Build unsigned Cutline.app with xcodebuild
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          xcodebuild \
            -project cutline.xcodeproj \
            -scheme cutline_iOS \
            -configuration release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned .ipa for AltStore / SideStore / Sideloadly
        run: |
          set -euo pipefail
          APP_PATH=$(find src-tauri/gen/apple/build/Build/Products/release-iphoneos -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found app bundle: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          VERSION=$(node -p "require('./package.json').version")
          IPA_NAME="Cutline_${VERSION}_ios.ipa"
          zip -qry "$IPA_NAME" Payload
          shasum -a 256 "$IPA_NAME" | tee "${IPA_NAME}.sha256"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-ios-ipa
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256

      - name: Attach .ipa to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" "$IPA_NAME" "${IPA_NAME}.sha256" --clobber || true
