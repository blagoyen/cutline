name: Build Cutline iOS Unsigned (.ipa)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust & aarch64-apple-ios target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install XcodeGen
        run: brew install xcodegen || true

      - name: Install frontend dependencies & build dist
        run: |
          npm ci
          npm run build

      - name: Initialize Tauri iOS project & sync Cutline AppIcon
        run: |
          set -euo pipefail
          npx tauri ios init --ci
          npx tauri icon src-tauri/icons/icon.png
          ICON_DEST=$(find src-tauri/gen/apple -type d -name "AppIcon.appiconset" | head -n 1)
          if [ -n "$ICON_DEST" ] && [ -d "src-tauri/icons/ios" ]; then
            echo "Syncing Cutline iOS icons into $ICON_DEST"
            cp -f src-tauri/icons/ios/*.png "$ICON_DEST/"
          fi

      - name: Build Rust staticlib for aarch64-apple-ios
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          set -euo pipefail
          cargo rustc --manifest-path src-tauri/Cargo.toml --release --target aarch64-apple-ios --lib --features tauri/custom-protocol --crate-type staticlib
          mkdir -p src-tauri/gen/apple/Externals/arm64/release
          cp src-tauri/target/aarch64-apple-ios/release/libcutline_lib.a src-tauri/gen/apple/Externals/arm64/release/libapp.a
          ls -lh src-tauri/gen/apple/Externals/arm64/release/libapp.a

      - name: Inject Cutline AVFoundation Swift bridge, Info.plist keys & patch project.yml
        run: |
          set -euo pipefail
          SRC_DIR=$(find src-tauri/gen/apple/Sources -mindepth 1 -maxdepth 1 -type d | head -n 1)
          echo "Injecting CutlineMedia.swift into: $SRC_DIR"
          cp "src-tauri/ios-plugin/CutlineMedia.swift" "$SRC_DIR/CutlineMedia.swift"

          PLIST=$(find src-tauri/gen/apple -maxdepth 2 -name "Info.plist" | head -n 1)
          echo "Updating Info.plist: $PLIST"
          if [ -n "$PLIST" ] && [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Cutline saves exported video clips directly to your Photos library.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Cutline saves exported video clips directly to your Photos library.'" "$PLIST"

            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"

            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"

            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST"
          fi

          # Remove Tauri's preBuildScripts (which require a live `tauri ios build` server)
          # since we already compiled libapp.a directly above.
          python3 -c 'import re, pathlib; p = pathlib.Path("src-tauri/gen/apple/project.yml"); p.write_text(re.sub(r"(?m)^    preBuildScripts:\n(?:      .*\n)*", "", p.read_text())); print("Patched project.yml")'

          (cd src-tauri/gen/apple && xcodegen generate)

      - name: Build unsigned Cutline.app for iOS (aarch64-apple-ios)
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          echo "Building project=$PROJ scheme=$SCHEME (unsigned)"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package clean unsigned .ipa for Sideloadly
        run: |
          set -euo pipefail
          APP_PATH=$(find src-tauri/gen/apple/build/Build/Products/release-iphoneos -maxdepth 2 -name "*.app" | head -n 1)
          echo "Packaging unsigned app bundle: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # Strip any stray signatures or provisioning profiles so Sideloadly signs cleanly
          find Payload -name "_CodeSignature" -type d -exec rm -rf {} + || true
          find Payload -name "embedded.mobileprovision" -delete || true

          VERSION=$(node -p "require('./package.json').version")
          IPA_NAME="Cutline_${VERSION}_ios_unsigned.ipa"
          zip -qry "$IPA_NAME" Payload
          shasum -a 256 "$IPA_NAME" | tee "${IPA_NAME}.sha256"
          ls -lh "$IPA_NAME"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-ios-unsigned-ipa
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256

      - name: Attach unsigned .ipa to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" "$IPA_NAME" "${IPA_NAME}.sha256" --clobber || true
